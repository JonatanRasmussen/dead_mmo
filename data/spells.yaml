# ==========================================
# Start of configs (spells.yaml)
# ==========================================
empty_spell:

# ==========================================
# Basic Movement
# ==========================================
start_move_up:
  validation:
    is_targeting_self: true
  effects:
    walk_forward: true

stop_move_up:
  validation:
    is_targeting_self: true
  effects:
    walk_forward: false

start_move_left:
  validation:
    is_targeting_self: true
  effects:
    walk_left: true

stop_move_left:
  validation:
    is_targeting_self: true
  effects:
    walk_left: false

start_move_down:
  validation:
    is_targeting_self: true
  effects:
    walk_backward: true

stop_move_down:
  validation:
    is_targeting_self: true
  effects:
    walk_backward: false

start_move_right:
  validation:
    is_targeting_self: true
  effects:
    walk_right: true

stop_move_right:
  validation:
    is_targeting_self: true
  effects:
    walk_right: false

step_towards_target:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
    walk_towards_target: true
  triggers:
    timeline:
      20: [step_towards_target]

start_move_towards_target:
  validations:
    is_targeting_self: true
  effects:
    gain_channeling_ticks: 3600
  triggers:
    timeline:
      20: [step_towards_target]

# ==========================================
# Npc Healing Powerup
# ==========================================
keypress_healing_powerup:
  validations:
    is_targeting_self: true
    is_gcd_ready: true
  effects:
    play_audio: Rejuvenation
    gcd_duration: 1000
  triggers:
    timeline:
      0: [init_healing_powerup]

init_healing_powerup:
  validations:
    is_targeting_self: true
  effects:
    spawn_as_child: true
    is_unhittable: true
    gain_channeling_ticks: 150
    hp: 30.0
    x_offset: 0.2
    y_offset: -0.2
    color_red: 0
    color_green: 255
    color_blue: 0
  triggers:
    timeline:
      200: [tick_healing_powerup]

tick_healing_powerup:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
  triggers:
    timeline:
      0: [try_trigger_healing_powerup]
      100: [tick_healing_powerup]

try_trigger_healing_powerup:
  validations:
    is_targeting_self: true
    is_destination_within_range: 0.1
  effects:
    gain_channeling_ticks: -65535
    turn_invisible: true
  triggers:
    timeline:
      0: [healing_powerup_apply]

healing_powerup_apply:
  validations:
    is_target_the_destination: true
  effects:
    play_audio: Rejuvenation
    heal: 150.0

# ==========================================
# Npc Landmine
# ==========================================
keypress_landmine:
  validations:
    is_targeting_self: true
  effect:
    play_audio: MoltenBlastHit
  triggers:
    timeline:
      0: [init_landmine]

init_landmine:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    spawn_as_child: true
    gain_channeling_ticks: 150
    hp: 20.0
    x_offset: -0.5
    y_offset: 0.1
    color_red: 255
    color_green: 0
    color_blue: 255
  triggers:
    timeline:
      1500: [tick_landmine]

tick_landmine:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
  triggers:
    timeline:
      0: [try_trigger_landmine]
      100: [tick_landmine]

try_trigger_landmine:
  validations:
    is_targeting_self: true
    is_destination_within_range: 0.1
  effects:
    gain_channeling_ticks: -65535
    turn_invisible: true
    is_unhittable: true
  triggers:
    timeline:
      0: [landmine_apply]

landmine_apply:
  validations:
    is_target_the_destination: true
  effects:
    play_audio: MoltenBlastHit
    damage: 134.0

# ==========================================
# Npc Target Dummy
# ==========================================
spawn_target_dummy:
  validations:
    is_targeting_self: true
  triggers:
    timeline:
      0: [init_target_dummy]

init_target_dummy:
  validations:
    is_targeting_self: true
  effects:
    spawn_as_child: true
    threat_score: 901
    hp: 80.0
    x_offset: -0.2
    y_offset: 0.1
    color_red: 0
    color_green: 0
    color_blue: 255
  triggers:
    timeline:
      4000: [molten_blast_aoe]
      7000: [start_move_towards_target]

spawn_bravo_dummy:
  validations:
    is_targeting_self: true
  triggers:
    timeline:
      0: [init_bravo_dummy]

init_bravo_dummy:
  validations:
    is_targeting_self: true
  effects:
    spawn_as_child: true
    threat_score: 9001
    hp: 80.0
    x_offset: -0.2
    y_offset: 0.1
    color_red: 0
    color_green: 0
    color_blue: 255
  triggers:
    timeline:
      2000: [shadow_blast_apply]
      7000: [start_move_towards_target]

# ==========================================
# Spec Warlock
# ==========================================
molten_blast_aoe:
  validations:
    is_targeting_self: true
    is_gcd_ready: true
  effects:
    gcd_duration: 500
  triggers:
    timeline:
      0: [molten_blast_trigger]

molten_blast_trigger:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    play_audio: MoltenBlastHit
    damage: 13.0

shadow_blast_buttonpress:
  validations:
    is_targeting_self: true
    is_gcd_ready: true
  effects:
    gcd_duration: 500
    gain_channeling_ticks: 4
  triggers:
    timeline:
      0: [shadow_blast_tick]

shadow_blast_apply:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    damage: 53.0
    play_audio: MoltenBlastHit

shadow_blast_tick:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
  triggers:
    timeline:
      0: [shadow_blast_apply]
      300: [shadow_blast_tick]

shadowbolt_keypress:
  validations:
    is_targeting_self: true
    is_cooldown_ready: true
    is_gcd_ready: true
  effects:
    play_audio: ShadowBoltCast
    base_cooldown: 2000
    gcd_duration: 1000
  triggers:
    timeline:
      0: [shadowbolt_init]

shadowbolt_init:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    spawn_as_child: true
    is_unhittable: true
    gain_channeling_ticks: 3600
    x_offset: 0.0
    y_offset: 0.05
    movespeed: 5.0
    color_red: 255
    color_green: 255
    color_blue: 255
  triggers:
    timeline:
      20: [shadowbolt_tick]

shadowbolt_tick:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
    walk_towards_target: true
  triggers:
    timeline:
      0: [shadowbolt_try_trigger]
      20: [shadowbolt_tick]

shadowbolt_try_trigger:
  validations:
    is_targeting_self: true
    is_destination_within_range: 0.05
  effects:
    gain_channeling_ticks: -65535
    turn_invisible: true
    movespeed: 0.0
    play_audio: ShadowBoltHit
    animation_id: explosion
    animation_frames: 7
    animation_speed: 100
    animation_loops: 2
    animation_scale: 0.5
    play_animation: true
  triggers:
    timeline:
      0: [shadowbolt_apply]

shadowbolt_apply:
  validations:
    is_target_the_destination: true
  effects:
    damage: 34.0

# ==========================================
# Boss and Player
# ==========================================
init_bravo_boss:
  validations:
    is_targeting_self: true
  effects:
    spawn_as_child: true
    teamswap: true
    threat_score: 9001
    hp: 30.0
    x_offset: 0.7
    y_offset: 0.7
    color_red: 0
    color_green: 255
    color_blue: 0
  triggers:
    timeline:
      400: [spawn_bravo_dummy]
      800: [keypress_landmine]
      3000: [molten_blast_aoe]
      5000: [shadowbolt_keypress]

init_player:
  validations:
    is_targeting_self: true
  effects:
    spawn_as_child: true
    player_number: 1
    hp: 30.0
    x_offset: 0.3
    y_offset: 0.3
    color_red: 255
    color_green: 0
    color_blue: 0
    animation_id: poro
    animation_frames: 1
    animation_speed: 1000000
    animation_loops: 1
    play_animation: true
    damage: 34.0