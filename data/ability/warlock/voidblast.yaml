learn_voidblast:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    attach_to_target: true
    select_spell_id: keypress_voidblast
    bind_to_input_id: input_ability_2
    assign_to_faction: 1
    is_visible: true
    draw_as_square: true
    draw_as_parent_cd: true
    color_red: 255
    color_green: 0
    color_blue: 0
    offset_x: -66
    offset_y: -150

keypress_voidblast:
  validations:
    is_targeting_target: true
    is_cd_ready: true
    is_gcd_ready: true
    is_shared_castbar_available: true
  effects:
    add_cooldown: 1000
  timeline:
    0: [cd_voidblast, tick_voidblast]

cd_voidblast:
  validations:
    is_targeting_self: true
  effects:
    add_cooldown: 5000
    gain_casting_ticks: 3
    begin_cast: 300

apply_voidblast:
  validations:
    is_dest_hittable: true
    is_dest_other_faction: true
  effects:
    damage: 53
    play_audio: MoltenBlastHit

tick_voidblast:
  validations:
    is_targeting_self: true
    has_casting_ticks: 1
  effects:
    gain_casting_ticks: -1
    begin_cast: 300
  timeline:
    0: [apply_voidblast]
    300: [tick_voidblast]