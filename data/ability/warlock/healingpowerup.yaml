learn_healingpowerup:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    attach_to_target: true
    select_spell_id: keypress_healingpowerup
    bind_to_input_id: input_ability_3
    assign_to_faction: 1
    is_visible: true
    draw_as_square: true
    draw_as_cd_bar: true
    color_red: 0
    color_green: 255
    color_blue: 255
    offset_x: 66
    offset_y: -150

keypress_healingpowerup:
  validations:
    is_targeting_target: true
    is_cd_ready: true
    is_gcd_ready: true
  effects:
    add_cooldown: 1000
  timeline:
    0: [cd_healingpowerup, spawn_healingpowerup]

cd_healingpowerup:
  validations:
    is_targeting_self: true
  effects:
    play_audio: Rejuvenation
    add_cooldown: 2000

spawn_healingpowerup:
  validations:
    is_targeting_target: true
  spawn_as_child: true
  effects:
    gain_channeling_ticks: 150
    hp: 30
    x_displacement: 200
    y_displacement: -200
    is_visible: true
    color_red: 0
    color_green: 255
    color_blue: 255
  timeline:
    200: [tick_healingpowerup]

tick_healingpowerup:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
    walk_towards_target: true
  timeline:
    0: [tryapply_healingpowerup]
    100: [tick_healingpowerup]

tryapply_healingpowerup:
  validations:
    is_targeting_target: true
    is_dest_within_range: 20
  effects:
    heal: 150
  timeline:
    0: [end_healingpowerup]

end_healingpowerup:
  validations:
    is_targeting_self: true
  effects:
    play_audio: Rejuvenation
    gain_channeling_ticks: -65535
    is_visible: false