learn_fighterkick:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    attach_to_destination: true
    select_spell_id: keypress_fighterkick
    bind_to_input_id: input_ability_1
    offset_x: -300
    offset_y: -150

keypress_fighterkick:
  validations:
    is_targeting_destination: true
    is_cd_ready: true
    is_gcd_ready: true
  effects:
    add_cooldown: 1000
  timeline:
    0: [cd_fighterkick, apply_fighterkick]

cd_fighterkick:
  validations:
    is_targeting_self: true
  effects:
    play_audio: FighterKickCast
    add_cooldown: 1000

apply_fighterkick:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    damage: 8