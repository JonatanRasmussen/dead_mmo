learn_shadowbolt:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    attach_to_target: true
    select_spell_id: keypress_shadowbolt
    bind_to_input_id: input_ability_4
    assign_to_faction: 1
    is_visible: true
    draw_as_square: true
    draw_as_cd_bar: true
    color_red: 0
    color_green: 255
    color_blue: 0
    offset_x: 198
    offset_y: -150

keypress_shadowbolt:
  validations:
    is_targeting_target: true
    is_cd_ready: true
    is_gcd_ready: true
  effects:
    add_cooldown: 1000
  timeline:
    0: [cd_shadowbolt, spawn_shadowbolt]

cd_shadowbolt:
  validations:
    is_targeting_self: true
  effects:
    play_audio: ShadowBoltCast
    add_cooldown: 4000

spawn_shadowbolt:
  validations:
    is_dest_hittable: true
    is_dest_other_faction: true
  spawn_as_child: true
  effects:
    gain_channeling_ticks: 3600
    x_displacement: 0
    y_displacement: 50
    hp: 1
    movespeed: 500
    is_visible: true
    color_red: 255
    color_green: 255
    color_blue: 0
  timeline:
    20: [tick_shadowbolt]

tick_shadowbolt:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
    walk_towards_target: true
  timeline:
    0: [tryapply_shadowbolt]
    20: [tick_shadowbolt]

tryapply_shadowbolt:
  validations:
    is_targeting_target: true
    is_dest_within_range: 20
  effects:
    damage: 34
  timeline:
    0: [end_shadowbolt]

end_shadowbolt:
  validations:
    is_targeting_self: true
  effects:
    gain_channeling_ticks: -65535
    is_visible: false
    movespeed: 0
    play_audio: ShadowBoltHit
    sprite_id: explosion
    sprite_frames: 7
    animation_speed: 100
    animation_loops: 2
    animation_scale: 50
    play_animation: true