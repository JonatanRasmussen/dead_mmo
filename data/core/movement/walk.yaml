learn_walk:
  validations:
    is_targeting_self: true
  timeline:
    0:
      - learn_startwalkforward
      - learn_stopwalkforward
      - learn_startwalkleft
      - learn_stopwalkleft
      - learn_startwalkbackward
      - learn_stopwalkbackward
      - learn_startwalkright
      - learn_stopwalkright

# Walk forward

learn_startwalkforward:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    select_spell_id: keypress_startwalkforward
    bind_to_input_id: input_startmove_up
  timeline:
    0: [init_spellslot]

keypress_startwalkforward:
  validations:
    is_targeting_destination: true
  effects:
    walk_forward: true

learn_stopwalkforward:
  validations:
    is_targeting_self: true
  spawn_as_child: true
  effects:
    select_spell_id: keypress_stopwalkforward
    bind_to_input_id: input_stopmove_up
  timeline:
    0: [init_spellslot]

keypress_stopwalkforward:
  validations:
    is_targeting_destination: true
  effects:
    walk_forward: false

