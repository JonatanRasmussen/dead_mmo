# ==========================================
# Npc Landmine
# ==========================================
keypress_landmine:
  validations:
    is_targeting_self: true
  effect:
    play_audio: MoltenBlastHit
  timeline:
    0: [init_landmine]

init_landmine:
  spawn_as_child: true
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    gain_channeling_ticks: 150
    hp: 20.0
    x_offset: -0.5
    y_offset: 0.1
    color_red: 255
    color_green: 0
    color_blue: 255
  timeline:
    1500: [tick_landmine]

tick_landmine:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
  timeline:
    0: [try_trigger_landmine]
    100: [tick_landmine]

try_trigger_landmine:
  validations:
    is_targeting_self: true
    is_destination_within_range: 0.1
  effects:
    gain_channeling_ticks: -65535
    turn_invisible: true
    is_unhittable: true
  timeline:
    0: [landmine_apply]

landmine_apply:
  validations:
    is_targeting_destination: true
  effects:
    play_audio: MoltenBlastHit
    damage: 134.0

