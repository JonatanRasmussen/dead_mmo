# ==========================================
# Spec Warlock
# ==========================================
molten_blast_aoe:
  validations:
    is_targeting_self: true
    is_gcd_ready: true
  effects:
    add_cooldown: 500
  timeline:
    0: [molten_blast_trigger]

molten_blast_trigger:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    play_audio: MoltenBlastHit
    damage: 13.0

shadow_blast_buttonpress:
  validations:
    is_targeting_self: true
    is_cd_ready: true
  effects:
    add_cooldown: 500
    gain_channeling_ticks: 4
  timeline:
    0: [shadow_blast_tick]

shadow_blast_apply:
  validations:
    is_target_hittable: true
    is_target_other_team: true
  effects:
    damage: 53.0
    play_audio: MoltenBlastHit

shadow_blast_tick:
  validations:
    is_targeting_self: true
    has_channeling_ticks: 1
  effects:
    gain_channeling_ticks: -1
  timeline:
    0: [shadow_blast_apply]
    300: [shadow_blast_tick]


# ==========================================
# Boss and Player
# ==========================================
init_bravo_boss:
  spawn_as_child: true
  validations:
    is_targeting_self: true
  effects:
    teamswap: true
    threat_score: 9001
    hp: 30.0
    x_offset: 0.7
    y_offset: 0.7
    sprite_id: baddie
    sprite_frames: 4
    animation_speed: 900
    animation_loops: 200
    animation_scale: 1.0
    play_animation: true
  timeline:
    400: [spawn_bravo_dummy]
    800: [keypress_landmine]
    3000: [molten_blast_aoe]
    5000: [shadowbolt_keypress]